<style>
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden}
  body{-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}

    position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;cursor:pointer;

  }

  }

  #ov .go,#rec360,#vprev .row button{

  }

  #v0{

  }

  }

  }
  #vprev .row button:hover{border-color:#fff;color:#fff;background:rgba(255,255,255,.06)}
  #vprev .note{font:9px ui-monospace,Menlo,monospace;letter-spacing:2px;color:rgba(255,255,255,.3)}

  /* canvas text keeps the browser's default smoothing: body's antialiased would thin it on macOS */
  canvas{-webkit-font-smoothing:auto}

<body>
<canvas id="c"></canvas>
<div id="ov">
  <h1>SPATIOTEMPORAL&nbsp; VOCAL&nbsp; MANIFOLD</h1>
  <p class="sub">your voice, unfolded as a trajectory</p>
  <button class="go" type="button">CLICK TO BEGIN</button>
  <div class="mic">USES YOUR MICROPHONE &middot; NOTHING IS RECORDED OR SENT ANYWHERE</div>
</div>
<a id="v0" href="legacy/">V0 &middot; BALLISTIC BUILD &rarr;</a>
<div id="hint">SPEAK — THE MANIFOLD LISTENS</div>
<button id="rec360">⏺ EXPORT 360° ORBIT</button>
<div id="vprev">
  <video id="vprevVid" autoplay loop muted playsinline></video>
  <div class="row">
    <button id="vShare">SHARE</button>
    <button id="vSave">SAVE</button>
    <button id="vClose">CLOSE</button>
  </div>
  <div class="note">ON A PHONE: SHARE &rarr; &ldquo;SAVE VIDEO&rdquo; PUTS IT IN YOUR GALLERY</div>
</div>

<script>
'use strict';
/* ============================================================
   SPATIOTEMPORAL VOCAL MANIFOLD — realtime
   Mic → 40 mel-frequency cepstral coefficients per frame
   (mel filterbank + DCT-II) → streaming z-score → online PCA
   (Sanger's rule) → 3 principal dimensions. Each voiced frame
   emits a point; your speech unfolds as a trajectory through
   its own self-organizing manifold.
   (After Lucio Arese's birdsong visualizations.)
   Test hooks:  ?test  (synthetic voice, seeded)  &t=<sec>
   ============================================================ */

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const ov = document.getElementById('ov');
const hint = document.getElementById('hint');
let W = 0, H = 0, dpr = 1;

const Q = new URLSearchParams(location.search);
const TEST = Q.has('test');
const T0_OFFSET = parseFloat(Q.get('t') || '0') || 0;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rng = mulberry32(TEST ? 42 : (Date.now() & 0xffffffff));
const R  = () => rng();
const RS = () => rng()*2-1;
function clamp(v,a,b){return v<a?a:v>b?b:v}
function fmt(v,d){return v.toFixed(d===undefined?4:d)}

/* ================= DSP =================
   40 mel filters over 80 Hz – 8 kHz, DCT-II → 40 MFCCs        */
const NMEL = 40, FFT = 2048;
let AC = null, analyser = null, srate = 48000;
let dbArr = null, timeArr = null;
const lin = new Float32Array(FFT/2);
let melBankW = null;                 // [ [bin, weight], ... ] per filter
const melE = new Float32Array(NMEL);
const mfcc = new Float32Array(NMEL);
const mfccVis = new Float32Array(NMEL);   // smoothed, for the HUD bars
let dctTab = null;

function buildBank(sr){
  const nB = FFT/2, fMin = 80, fMax = Math.min(8000, sr/2 - 100);
  const mel = f => 2595*Math.log10(1+f/700);
  const imel = m => 700*(Math.pow(10,m/2595)-1);
  const m0 = mel(fMin), m1 = mel(fMax);
  const pts = [];
  for (let i=0;i<NMEL+2;i++) pts.push(imel(m0 + (m1-m0)*i/(NMEL+1)) / (sr/2) * nB);
  melBankW = [];
  for (let i=0;i<NMEL;i++){
    const a=pts[i], b=pts[i+1], c=pts[i+2], w=[];
    for (let k=Math.max(1,Math.floor(a)); k<=Math.min(nB-1,Math.ceil(c)); k++){
      const v = k < b ? (k-a)/(b-a) : (c-k)/(c-b);
      if (v > 0) w.push(k, v);
    }
    melBankW.push(w);
  }
  dctTab = new Float32Array(NMEL*NMEL);
  for (let k=0;k<NMEL;k++)
    for (let n=0;n<NMEL;n++)
      dctTab[k*NMEL+n] = Math.cos(Math.PI*k*(n+0.5)/NMEL);
}

/* streaming normalization + online PCA (Sanger / GHA) */
const emaM = new Float32Array(NMEL);
const emaV = new Float32Array(NMEL).fill(1);
let emaN = 0;
const zx = new Float32Array(NMEL);
const PC = [new Float32Array(NMEL), new Float32Array(NMEL), new Float32Array(NMEL)];
let pcaSteps = 0;
function pcaInit(){
  for (const w of PC){ for (let i=0;i<NMEL;i++) w[i] = RS(); }
  orthonorm();
}
function orthonorm(){
  for (let i=0;i<3;i++){
    const w = PC[i];
    for (let j=0;j<i;j++){
      const u = PC[j]; let d=0;
      for (let k=0;k<NMEL;k++) d += w[k]*u[k];
      for (let k=0;k<NMEL;k++) w[k] -= d*u[k];
    }
    let n=0; for (let k=0;k<NMEL;k++) n += w[k]*w[k];
    n = Math.sqrt(n)||1;
    for (let k=0;k<NMEL;k++) w[k] /= n;
  }
}
function pcaStep(x){
  pcaSteps++;
  const lr = Math.max(0.002, 0.03/Math.sqrt(1+pcaSteps*0.05));
  const y = [0,0,0];
  for (let i=0;i<3;i++){
    let s=0; const w=PC[i];
    for (let k=0;k<NMEL;k++) s+=w[k]*x[k];
    y[i]=clamp(s,-12,12);
  }
  /* Sanger: w_i += lr * y_i * (x - sum_{j<=i} y_j w_j),
     re-orthonormalized every step so the weights can't blow up */
  const res = new Float32Array(x);
  for (let i=0;i<3;i++){
    const w = PC[i];
    for (let k=0;k<NMEL;k++) res[k] -= y[i]*w[k];
    for (let k=0;k<NMEL;k++) w[k] += lr*y[i]*res[k];
  }
  orthonorm();
  return y;
}

/* per-frame features */
let rms = 0, centroidHz = 0, spreadHz = 0, voiced = false;
function analyse(tNow){
  if (TEST){ synthSpectrum(tNow); }
  else {
    analyser.getFloatFrequencyData(dbArr);
    analyser.getFloatTimeDomainData(timeArr);
    let s = 0;
    for (let i=0;i<timeArr.length;i++) s += timeArr[i]*timeArr[i];
    rms = Math.sqrt(s/timeArr.length);
    for (let b=0;b<lin.length;b++){
      const db = dbArr[b];
      lin[b] = db < -110 ? 0 : Math.pow(10, db/20);
    }
  }
  /* spectral centroid + spread (real, from the magnitude spectrum) */
  let sm=0, sf=0;
  const hzPerBin = srate/2/lin.length;
  for (let b=1;b<lin.length;b++){ sm += lin[b]; sf += lin[b]*b; }
  const cB = sm > 1e-7 ? sf/sm : 0;
  centroidHz = cB*hzPerBin;
  let sv=0;
  for (let b=1;b<lin.length;b++){ const d=b-cB; sv += lin[b]*d*d; }
  spreadHz = sm > 1e-7 ? Math.sqrt(sv/sm)*hzPerBin : 0;
  /* mel energies → log → DCT */
  for (let i=0;i<NMEL;i++){
    const w = melBankW[i]; let e=0;
    for (let j=0;j<w.length;j+=2) e += lin[w[j]]*w[j+1];
    melE[i] = Math.log(e + 1e-7);
  }
  for (let k=0;k<NMEL;k++){
    let s2=0;
    for (let n=0;n<NMEL;n++) s2 += melE[n]*dctTab[k*NMEL+n];
    mfcc[k] = s2;
    mfccVis[k] += (Math.abs(s2)*0.06 - mfccVis[k])*0.15;
  }
  /* voice activity with hysteresis */
  if (!voiced && rms > 0.017) voiced = true;
  else if (voiced && rms < 0.008) voiced = false;
  if (!voiced) return null;
  /* normalize + project — exact running mean early, then EMA,
     z-scores clamped so warm-up can't destabilize the PCA */
  emaN++;
  const rate = Math.max(0.012, 1/emaN);
  for (let k=0;k<NMEL;k++){
    const d = mfcc[k]-emaM[k];
    emaM[k] += d*rate;
    emaV[k] += (d*d - emaV[k])*rate;
    zx[k] = clamp(d/Math.sqrt(emaV[k]+1e-6), -4, 4);
  }
  if (emaN < 12) return null;      // stats not warm yet
  return pcaStep(zx);
}

/* synthetic "voice" for ?test / no-mic demo: moving formants */
let demoMode = false;
function synthSpectrum(t){
  const hzPerBin = srate/2/lin.length;
  lin.fill(0);
  const syll = Math.sin(t*3.1) + Math.sin(t*4.7)*0.6;
  const on = syll > -0.2;
  rms = on ? 0.05 + 0.03*Math.sin(t*7) : 0.002;
  if (!on) return;
  /* hop between pseudo-phonemes every 350 ms */
  const ph = Math.floor(t/0.35);
  const h = k => { const v = Math.sin((ph+k)*12.9898)*43758.5453; return v - Math.floor(v); };
  const F = [ 320 + h(1)*700, 900 + h(2)*1700, 2200 + h(3)*1300 ];
  for (let fi=0;fi<3;fi++){
    const cB = F[fi]/hzPerBin, wB = 14+fi*8, amp = 1/(fi+1);
    const s = Math.max(1,(cB-wB*3)|0), e = Math.min(lin.length-1,(cB+wB*3)|0);
    for (let b=s;b<=e;b++){
      const d = (b-cB)/wB;
      lin[b] += amp*Math.exp(-d*d);
    }
  }
}

/* ================= manifold state ================= */
const CAP = 560;
let pts = [];          // emitted points, oldest first
let links = [];
let linkTick = 0;
let emitTick = 0;
let anchorCount = 0;
let ctr = {x:0,y:0,z:0};      // EMA cloud centre
let started = false, startAt = 0;
let lastVoiceAt = -10;

const S = 34;          // world units per PCA unit
function emit(y, tNow){
  emitTick++;
  if (emitTick % 2) return;                       // ~30 Hz
  const px = clamp(y[0],-3.2,3.2)*S + RS()*4,
        py = clamp(y[1],-3.2,3.2)*S + RS()*4,
        pz = clamp(y[2],-3.2,3.2)*S + RS()*4;
  /* hue by manifold region (first principal component), so colors
     cluster spatially like the reference */
  const hue = 115 - clamp((y[0]+2.2)/4.4, 0, 1)*115;
  const big = (++anchorCount % 47) === 0;
  const p = {
    x:px, y:py, z:pz,
    hue, white: rms > 0.09 || big && R()<0.5,
    lab: fmt(Math.abs(mfcc[1]%1)),
    hasLab: R() < 0.55,
    big,
    sub: big ? [ fmt(centroidHz/1000,2)+'k  '+fmt(spreadHz/1000,2)+'k',
                 't '+fmt(tNow,1) ] : null,
    p0:R()*6.28, p1:R()*6.28, p2:R()*6.28,
    amp: 1+R()*2.5,
    at: tNow,
    s: 1.1+R()*1.4
  };
  pts.push(p);
  if (pts.length > CAP) pts.splice(0, pts.length-CAP);
  ctr.x += (px-ctr.x)*0.02; ctr.y += (py-ctr.y)*0.02; ctr.z += (pz-ctr.z)*0.02;
}

/* ================= projection ================= */
const FOV = 620;
let rotY = 0;
const cam = {zoom:1};
function proj(x,y,z){
  const dx = x-ctr.x, dy = y-ctr.y, dz = z-ctr.z;
  const c = Math.cos(rotY), s = Math.sin(rotY);
  const rx = dx*c - dz*s, rz = dx*s + dz*c;
  const sc = FOV/(FOV+rz*2.2);
  return { x: W/2 + rx*sc*cam.zoom, y: H/2 - 20 + dy*sc*cam.zoom, sc: sc*cam.zoom, z: rz };
}
function hueRGB(h){
  const s=0.9,l=0.62,c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;
  let r,g,b;
  if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}
  else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}
  return `${((r+m)*255)|0},${((g+m)*255)|0},${((b+m)*255)|0}`;
}

/* ================= HUD ================= */
let hudA=0, hudB=0;
function drawHUD(t){
  ctx.save();
  ctx.textBaseline='top';
  ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.font='10px ui-monospace,Menlo,monospace';
  ctx.textAlign='left';
  ctx.fillText('SPATIOTEMPORAL  VOCAL  MANIFOLD', 14, 12);
  ctx.fillStyle='rgba(255,255,255,.28)';
  ctx.fillText('40 MFCC → PCA(3) · LIVE' + (demoMode?' · DEMO SIGNAL (NO MIC)':''), 14, 26);

  const rx = W-14;
  ctx.textAlign='right';
  if (voiced){
    hudA += (spreadHz/1000 - hudA)*0.1;
    hudB += (centroidHz/1000 - hudB)*0.1;
  }
  ctx.fillStyle='rgba(255,255,255,.75)';
  ctx.fillText(fmt(hudA,2)+'k', rx-60, 12);
  ctx.fillText(fmt(hudB,2)+'k', rx, 12);
  ctx.strokeStyle = voiced ? 'rgba(255,60,50,.95)' : 'rgba(255,60,50,.35)';
  ctx.strokeRect(rx-50, 11, 10, 10);
  ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.fillText('SPECTRAL SPREAD', rx-148, 27);
  ctx.fillText('SPECTRAL CENTROID', rx, 27);
  ctx.fillText('EMISSION TIME', rx, 44);
  ctx.strokeStyle='rgba(255,255,255,.25)';
  ctx.beginPath(); ctx.moveTo(rx-120,58); ctx.lineTo(rx,58); ctx.stroke();
  const pT = (t%30)/30;
  ctx.fillStyle='rgba(255,80,60,.9)';
  ctx.fillRect(rx-120+pT*118, 55, 2, 6);

  /* live MFCC bars */
  if (H > 560){
    ctx.font='7px ui-monospace,Menlo,monospace';
    const y0=84, rh=Math.min(10,(H-160-y0)/NMEL);
    for (let i=0;i<NMEL;i++){
      const y=y0+i*rh;
      ctx.fillStyle='rgba(255,255,255,.25)';
      ctx.fillText('MFCC'+String(i+1).padStart(2,'0'), rx, y);
      const w=clamp(mfccVis[i],0,1)*54;
      ctx.fillStyle='rgba(170,150,255,.5)';
      ctx.fillRect(rx-42-w, y+1.5, w, 2);
    }
  }

  ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,.85)';
  ctx.font='italic 19px Georgia,"Times New Roman",serif';
  try{ ctx.letterSpacing='5px'; }catch(e){}
  ctx.fillText('Subject A  (Homo Sapiens)', W/2, H-52);
  try{ ctx.letterSpacing='0px'; }catch(e){}

  /* the exported orbit carries the address home */
  if (recOn){
    ctx.textAlign='left';
    ctx.font='10px ui-monospace,Menlo,monospace';
    ctx.fillStyle='rgba(255,255,255,.4)';
    ctx.fillText('vaibhavkumar.is-a.dev/anime-voice-fights', 14, H-18);
  }
  ctx.restore();
}

/* ================= 360° orbit export =================
   Drives rotY through one full horizontal revolution over
   REC_DUR while MediaRecorder films the canvas (video only,
   no audio — the mic never leaves the page), then hands the
   rotation back with no visible jump. mp4 where the browser
   can record it (WhatsApp/Instagram/iOS-gallery friendly),
   webm elsewhere. */
const REC_DUR = 8000;
let rotOff = 0, recOn = false, recBase = 0, recT0 = 0, recorder = null, recFile = null;
const rec360 = document.getElementById('rec360');
function bestVideoMime(){
  if (!window.MediaRecorder) return null;
  const m = ['video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  for (const t of m) if (MediaRecorder.isTypeSupported(t)) return t;
  return null;
}
function startRec(){
  if (recOn || !started) return;
  const mime = bestVideoMime();
  if (!mime){ rec360.textContent = 'VIDEO EXPORT UNSUPPORTED HERE'; return; }
  const chunks = [];
  try { recorder = new MediaRecorder(canvas.captureStream(30), { mimeType: mime, videoBitsPerSecond: 10000000 }); }
  catch(e){ rec360.textContent = 'VIDEO EXPORT UNSUPPORTED HERE'; return; }
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const ext = mime.indexOf('mp4') > -1 ? 'mp4' : 'webm';
    const blob = new Blob(chunks, { type: mime.split(';')[0] });
    recFile = new File([blob], 'vocal-manifold-360.' + ext, { type: blob.type });
    const v = document.getElementById('vprevVid');
    v.src = URL.createObjectURL(blob);
    document.getElementById('vShare').style.display =
      (navigator.canShare && navigator.canShare({ files: [recFile] })) ? '' : 'none';
    document.getElementById('vprev').classList.add('on');
    rec360.textContent = '⏺ EXPORT 360° ORBIT';
  };
  recBase = rotY;
  recT0 = performance.now();
  recOn = true;
  recorder.start(200);
}
function finishRec(t){
  recOn = false;
  rotOff = recBase - t*0.11;   // a full turn lands back on its start angle
  setTimeout(() => { try{ recorder.stop(); }catch(e){} }, 150);
}
rec360.addEventListener('click', startRec);
document.getElementById('vClose').addEventListener('click', function(){
  document.getElementById('vprev').classList.remove('on');
});
document.getElementById('vSave').addEventListener('click', function(){
  const a = document.createElement('a');
  a.href = document.getElementById('vprevVid').src;
  a.download = recFile.name;
  a.click();
});
document.getElementById('vShare').addEventListener('click', function(){
  navigator.share({ files: [recFile], title: 'vocal manifold' }).catch(function(){});
});

/* ================= render loop ================= */
let t0 = 0;
function frame(now){
  const t = (now - t0)/1000 + T0_OFFSET;
  if (recOn){
    const k = Math.min(1, (now - recT0)/REC_DUR);
    rotY = recBase + k*Math.PI*2;      // exactly one horizontal orbit
    rec360.textContent = '⏺ ORBITING… ' + Math.ceil((REC_DUR - (now - recT0))/1000) + 's';
    if (k >= 1) finishRec(t);
  } else {
    rotY = t*0.11 + rotOff;
  }
  cam.zoom = Math.min(W,H)/300;

  const y = analyse(t);
  if (y){ emit(y, t); lastVoiceAt = t; }

  /* drift + links */
  if (++linkTick % 8 === 0){
    links = [];
    const RAD = 34, R2 = RAD*RAD;
    const n = pts.length, stride = n > 300 ? 2 : 1;
    for (let i=0;i<n && links.length<1200;i+=stride){
      for (let j=i+stride;j<n && links.length<1200;j+=stride){
        const a=pts[i], b=pts[j];
        const dx=a.x-b.x, dy=a.y-b.y, dz=a.z-b.z;
        const d2=dx*dx+dy*dy+dz*dz;
        if (d2<R2) links.push([i,j,1-Math.sqrt(d2)/RAD]);
      }
    }
  }

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  ctx.lineWidth=0.6;

  const n = pts.length;
  /* age alpha: once at capacity, the oldest 20% fade out */
  const fadeN = Math.max(1, CAP*0.2);
  function alphaOf(i){ return n<CAP ? 1 : clamp(i/fadeN, 0, 1); }

  /* links */
  for (const [i,j,w] of links){
    const a=pts[i];
    const pa=proj(pts[i].x,pts[i].y,pts[i].z), pb=proj(pts[j].x,pts[j].y,pts[j].z);
    const col = a.white?'255,255,255':hueRGB(a.hue);
    ctx.strokeStyle=`rgba(${col},${(w*0.24*Math.min(alphaOf(i),alphaOf(j))).toFixed(3)})`;
    ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y); ctx.stroke();
  }

  /* the trajectory: last 26 points, bright white, newest brightest */
  const TR = 26;
  if (n > 1){
    for (let k=Math.max(0,n-TR); k<n-1; k++){
      const a=proj(pts[k].x,pts[k].y,pts[k].z), b=proj(pts[k+1].x,pts[k+1].y,pts[k+1].z);
      const fa=(k-(n-TR))/TR;
      ctx.strokeStyle=`rgba(255,255,255,${(0.08+fa*0.55).toFixed(3)})`;
      ctx.lineWidth=0.7+fa*0.9;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    }
    ctx.lineWidth=0.6;
  }

  /* nodes + labels */
  const labelFont='9px ui-monospace,Menlo,monospace';
  ctx.textBaseline='alphabetic'; ctx.textAlign='left';
  for (let i=0;i<n;i++){
    const p=pts[i];
    /* gentle drift */
    const wob=Math.sin(t*0.45+p.p0)*p.amp;
    const pp=proj(p.x+wob, p.y+Math.sin(t*0.4+p.p1)*p.amp, p.z+Math.sin(t*0.36+p.p2)*p.amp);
    if (pp.x<-40||pp.x>W+40||pp.y<-40||pp.y>H+40) continue;
    const depth=clamp(1-pp.z/220,0.25,1.15);
    const col=p.white?'255,255,255':hueRGB(p.hue);
    const a=depth*alphaOf(i);
    const s=p.s*pp.sc*0.7;
    if (p.big){
      ctx.strokeStyle=`rgba(${col},${a})`; ctx.lineWidth=1.2;
      ctx.strokeRect(pp.x-s*3,pp.y-s*3,s*6,s*6);
      ctx.lineWidth=0.6;
      ctx.fillStyle=`rgba(${col},${a})`;
      ctx.font='12px ui-monospace,Menlo,monospace';
      ctx.fillText(p.lab, pp.x+s*3+4, pp.y-2);
      ctx.font=labelFont;
      ctx.fillStyle=`rgba(${col},${a*0.7})`;
      ctx.fillText(p.sub[0], pp.x+s*3+4, pp.y+9);
      ctx.fillText(p.sub[1], pp.x+s*3+4, pp.y+19);
    } else {
      ctx.strokeStyle=`rgba(${col},${a*0.85})`;
      ctx.strokeRect(pp.x-s,pp.y-s,s*2,s*2);
      ctx.fillStyle=`rgba(${col},${a})`;
      ctx.fillRect(pp.x-s*0.4,pp.y-s*0.4,s*0.8,s*0.8);
      if (p.hasLab){
        ctx.font=labelFont;
        ctx.fillStyle=`rgba(${col},${(a*0.7).toFixed(3)})`;
        ctx.fillText(p.lab, pp.x+s+3, pp.y-2);
      }
    }
  }

  /* live cursor: current emission point glows */
  if (n>0 && t-lastVoiceAt < 0.2){
    const p=pts[n-1];
    const pp=proj(p.x,p.y,p.z);
    ctx.strokeStyle='rgba(255,255,255,.9)';
    ctx.lineWidth=1.4;
    ctx.strokeRect(pp.x-7,pp.y-7,14,14);
    ctx.lineWidth=0.6;
  }
  ctx.globalCompositeOperation='source-over';

  /* idle nudge: nothing said for a while */
  hint.style.opacity = (t-lastVoiceAt > 4 && n < 40) ? 1 : 0;

  /* vignette */
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.32,W/2,H/2,Math.max(W,H)*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  drawHUD(t);
  requestAnimationFrame(frame);
}

/* ================= boot ================= */
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
}
window.addEventListener('resize', resize);
resize();

async function begin(){
  if (started) return;
  started = true;
  ov.style.display='none';
  rec360.style.display='block';
  if (TEST){
    srate = 48000; buildBank(srate); pcaInit();
    demoMode = true;
    /* fast-forward: pre-run the whole pipeline so &t= matches playback */
    if (T0_OFFSET > 0){
      for (let tt=0; tt<T0_OFFSET; tt+=1/60){
        const y = analyse(tt);
        if (y){ emit(y, tt); lastVoiceAt = tt; }
      }
    }
    t0 = performance.now();
    requestAnimationFrame(frame);
    return;
  }
  AC = new (window.AudioContext||window.webkitAudioContext)();
  srate = AC.sampleRate;
  buildBank(srate); pcaInit();
  analyser = AC.createAnalyser();
  analyser.fftSize = FFT;
  analyser.smoothingTimeConstant = 0.45;
  dbArr = new Float32Array(analyser.frequencyBinCount);
  timeArr = new Float32Array(FFT);
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false, noiseSuppression:false, autoGainControl:true
    }});
    AC.createMediaStreamSource(stream).connect(analyser);
  } catch(e){
    /* no mic → demo signal so the page still performs */
    demoMode = true;
  }
  t0 = performance.now();
  requestAnimationFrame(frame);
}
ov.addEventListener('click', begin);
if (TEST) begin();
</script>

/* anonymous visit beacon — counts loads + presence heartbeats, no cookies */
(function(){
  if (location.protocol === "file:" || location.hostname === "localhost") return;
  var EP = "https://site-analytics.vaibhavpro9210.workers.dev/ping";
  var sid = sessionStorage.getItem("va_sid");
  if (!sid) { sid = Math.random().toString(36).slice(2) + Date.now().toString(36); sessionStorage.setItem("va_sid", sid); }
  function send(kind){
    try { navigator.sendBeacon(EP, new Blob([JSON.stringify({sid:sid, page:location.pathname, kind:kind})], {type:"text/plain"})); } catch(e){}
  }
  send("load");
  setInterval(function(){ if (document.visibilityState === "visible") send("beat"); }, 60000);
})();
